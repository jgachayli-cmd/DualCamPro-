name: Build iOS IPA

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Unzip Project
        run: |
          unzip DualCamPro_Xcode_Project.zip

      - name: Build IPA
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v3
        with:
          name: DualCamPro-IPA
          path: ./*.ipa
